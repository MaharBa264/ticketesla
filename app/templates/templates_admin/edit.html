{% extends "base.html" %}
{% block content %}
<div class="narrow">
  <div class="ticket-header">
    <div>
      <h1>Editar plantilla</h1>
      <p class="text-muted mb-0">Ajustá el texto guía sin afectar los tickets ya creados.</p>
    </div>
    <a class="btn btn-outline-secondary" href="{{ url_for('templates_admin.index') }}">Volver</a>
  </div>

  <form method="post" class="form-panel">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label class="form-label">Nombre visible</label>
    <input class="form-control" name="name" value="{{ template.name }}" required>

    <div class="row g-3 mt-1">
      <div class="col-md-4">
        <label class="form-label">Área</label>
        <select class="form-select" name="area_id" required>
          {% for a in areas %}<option value="{{ a.id }}" {% if template.area_id == a.id %}selected{% endif %}>{{ a.name }}</option>{% endfor %}
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label">Tipo de ticket</label>
        <select class="form-select" name="suggested_type" required>
          {% for t in types %}<option {% if template.suggested_type == t %}selected{% endif %}>{{ t }}</option>{% endfor %}
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label">Subtipo</label>
        <select class="form-select" name="suggested_subtype" required>
          {% for s in subtypes %}<option {% if template.suggested_subtype == s %}selected{% endif %}>{{ s }}</option>{% endfor %}
        </select>
      </div>
    </div>

    <label class="form-label mt-3">Texto base</label>
    <textarea class="form-control template-body" name="body" rows="12" required>{{ template.body }}</textarea>

    <div class="form-check mt-3">
      <input class="form-check-input" type="checkbox" name="active" id="active" {% if template.active %}checked{% endif %}>
      <label class="form-check-label" for="active">Activa</label>
    </div>

    <div class="d-flex gap-2 mt-4">
      <button class="btn btn-primary">Guardar cambios</button>
      <a class="btn btn-outline-secondary" href="{{ url_for('templates_admin.index') }}">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
