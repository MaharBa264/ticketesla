{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1>Tickets</h1>
  {% if has_perm('can_create_ticket') %}<a class="btn btn-primary" href="{{ url_for('tickets.create') }}">Nuevo ticket</a>{% endif %}
</div>
<form class="filter-bar mb-3">
  <input class="form-control" name="q" value="{{ request.args.get('q','') }}" placeholder="Texto, número, estación, equipo o tags">
  <select class="form-select" name="status"><option value="">Estado</option>{% for s in statuses %}<option value="{{ s }}" {% if request.args.get('status')==s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select>
  <select class="form-select" name="ticket_type"><option value="">Tipo</option>{% for t in types %}<option value="{{ t }}" {% if request.args.get('ticket_type')==t %}selected{% endif %}>{{ t }}</option>{% endfor %}</select>
  <select class="form-select" name="area_id"><option value="">Área</option>{% for a in areas %}<option value="{{ a.id }}" {% if request.args.get('area_id')==a.id|string %}selected{% endif %}>{{ a.name }}</option>{% endfor %}</select>
  <button class="btn btn-outline-primary">Filtrar</button>
  <a class="btn btn-outline-secondary" href="{{ url_for('tickets.index', mine=1) }}">Mis tickets</a>
</form>
{% include "tickets/_table.html" %}
{% endblock %}
