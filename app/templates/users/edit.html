{% extends "base.html" %}
{% block content %}
<div class="narrow">
  <h1>{{ "Editar usuario" if user else "Nuevo usuario" }}</h1>
  <form method="post" class="form-panel">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="row g-3">
      <div class="col-md-6"><label class="form-label">Nombre completo</label><input class="form-control" name="full_name" value="{{ user.full_name if user else '' }}" required></div>
      <div class="col-md-6"><label class="form-label">Usuario</label><input class="form-control" name="username" value="{{ user.username if user else '' }}" required></div>
      <div class="col-md-6"><label class="form-label">Gmail</label><input class="form-control" name="gmail" value="{{ user.gmail if user else '' }}" required></div>
      <div class="col-md-6"><label class="form-label">Contraseña</label><input class="form-control" type="password" name="password" {% if not user %}required{% endif %}></div>
      <div class="col-md-6"><label class="form-label">Correo corporativo</label><input class="form-control" name="corporate_email" value="{{ user.corporate_email if user else '' }}"></div>
      <div class="col-md-6"><label class="form-label">Teléfono</label><input class="form-control" name="phone" value="{{ user.phone if user else '' }}"></div>
      <div class="col-md-6"><label class="form-label">Área principal</label><select class="form-select" name="main_area_id">{% for a in areas %}<option value="{{ a.id }}" {% if user and user.main_area_id==a.id %}selected{% endif %}>{{ a.name }}</option>{% endfor %}</select></div>
      <div class="col-md-6"><div class="form-check mt-4"><input class="form-check-input" type="checkbox" name="active" id="active" {% if not user or user.active %}checked{% endif %}><label class="form-check-label" for="active">Activo</label></div></div>
      <div class="col-md-4"><label class="form-label">Roles</label><select class="form-select" name="roles" multiple size="6">{% for r in roles %}<option value="{{ r.id }}" {% if user and r in user.roles %}selected{% endif %}>{{ r.name }}</option>{% endfor %}</select></div>
      <div class="col-md-4"><label class="form-label">Permisos directos</label><select class="form-select" name="permissions" multiple size="6">{% for p in permissions %}<option value="{{ p.id }}" {% if user and p in user.direct_permissions %}selected{% endif %}>{{ p.name }}</option>{% endfor %}</select></div>
      <div class="col-md-4"><label class="form-label">Áreas visibles</label><select class="form-select" name="visible_areas" multiple size="6">{% for a in areas %}<option value="{{ a.id }}" {% if user and a in user.visible_areas %}selected{% endif %}>{{ a.name }}</option>{% endfor %}</select></div>
    </div>
    <button class="btn btn-primary mt-4">Guardar</button>
  </form>
  {% if user %}<form method="post" action="{{ url_for('users.revoke_tokens', user_id=user.id) }}" class="mt-3"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-outline-danger">Revocar sesiones persistentes</button></form>{% endif %}
</div>
{% endblock %}
