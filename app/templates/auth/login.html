{% extends "base.html" %}
{% block title %}Ingresar · Ticketesla{% endblock %}
{% block content %}
<div class="auth-shell">
  <form method="post" class="auth-card">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <h1>Ticketesla</h1>
    <label class="form-label">Usuario</label>
    <input class="form-control" name="username" autocomplete="username" required autofocus>
    <label class="form-label mt-3">Contraseña</label>
    <input class="form-control" type="password" name="password" autocomplete="current-password" required>
    <div class="form-check mt-3">
      <input class="form-check-input" type="checkbox" name="remember" id="remember">
      <label class="form-check-label" for="remember">Mantener sesión iniciada</label>
    </div>
    <button class="btn btn-primary w-100 mt-4">Ingresar</button>
    <a href="{{ url_for('auth.register') }}" class="d-block text-center mt-3">Crear usuario</a>
  </form>
</div>
{% endblock %}
