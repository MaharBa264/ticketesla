{% extends "base.html" %}
{% block title %}Calendario · Ticketesla{% endblock %}
{% block head %}<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <span class="page-kicker">Agenda técnica</span>
    <h1>Calendario</h1>
    <p class="lead-muted mb-0">Tickets con fecha límite para anticipar vencimientos.</p>
  </div>
</div>
<form class="filter-bar compact mb-3" id="calendarFilters">
  <select class="form-select" name="area_id"><option value="">Todas las áreas</option>{% for a in areas %}<option value="{{ a.id }}">{{ a.name }}</option>{% endfor %}</select>
  <select class="form-select" name="status"><option value="">Todos los estados</option>{% for s in statuses %}<option>{{ s }}</option>{% endfor %}</select>
  <button class="btn btn-outline-primary">Filtrar</button>
</form>
<div class="content-panel"><div id="calendar"></div></div>
{% endblock %}
{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script src="{{ url_for('static', filename='js/calendar.js') }}"></script>
{% endblock %}
